<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPR Screener</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            font-size: 10px;
        }

        header {
            padding: 6px 14px;
            border-bottom: 1px solid #30363d;
            background: #161b22;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }

        h1 {
            font-size: 11px;
            font-weight: 700;
            color: #e6edf3;
        }

        .meta-info { color: #8b949e; font-size: 9px; }
        .meta-info span { color: #58a6ff; font-weight: 600; }

        main { padding: 6px 10px; }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            flex-wrap: wrap;
            gap: 4px;
        }

        .filters { display: flex; gap: 3px; flex-wrap: wrap; }

        .filter-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 2px 9px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-btn:hover { background: #30363d; color: #e6edf3; }

        .filter-btn.active {
            background: #388bfd;
            color: #fff;
            border-color: #388bfd;
        }

        .copy-btn {
            background: #12261e;
            border: 1px solid #238636;
            color: #3fb950;
            padding: 2px 9px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: background 0.15s;
        }

        .copy-btn:hover { background: #1a3a2a; }

        .table-container {
            border: 1px solid #30363d;
            border-radius: 4px;
            overflow: hidden;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #161b22;
            padding: 3px 10px;
            font-weight: 700;
            color: #8b949e;
            font-size: 8.5px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #30363d;
            border-right: 1px solid #21262d;
        }

        th:last-child { border-right: none; }

        td {
            padding: 0 10px;
            line-height: 1.7;
            border-bottom: 1px solid #21262d;
            border-right: 1px solid #21262d;
            font-size: 9.5px;
            color: #e6edf3;
        }

        td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #161b22; }

        .sl-no { color: #8b949e; font-size: 8.5px; text-align: right; }

        .symbol-name { font-weight: 700; color: #e6edf3; font-size: 9.5px; }

        .category-tag {
            font-size: 8px;
            text-transform: uppercase;
            color: #8b949e;
            background: #21262d;
            padding: 1px 4px;
            border-radius: 2px;
            border: 1px solid #30363d;
        }

        .price-value { font-weight: 600; color: #e6edf3; }

        .date-value { color: #8b949e; font-size: 8.5px; }

        .badges { display: flex; gap: 3px; }

        .badge {
            font-size: 8px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 2px;
        }

        .badge-narrow {
            background: rgba(63, 185, 80, 0.15);
            color: #3fb950;
            border: 1px solid rgba(63, 185, 80, 0.4);
        }

        .badge-inside {
            background: rgba(56, 139, 253, 0.15);
            color: #58a6ff;
            border: 1px solid rgba(56, 139, 253, 0.4);
        }

        .empty-state { text-align: center; padding: 2rem; color: #8b949e; font-size: 10px; }

        .loading-spinner { text-align: center; padding: 1.5rem; color: #8b949e; font-size: 10px; }
        .loading-spinner::after {
            content: '';
            display: block;
            width: 18px;
            height: 18px;
            margin: 0.5rem auto;
            border: 2px solid #30363d;
            border-top-color: #388bfd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            text-align: center;
            padding: 5px;
            border-top: 1px solid #21262d;
            color: #484f58;
            font-size: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>CPR Screener</h1>
        <div class="meta-info" id="update-time">Loading...</div>
    </header>

    <main>
        <div class="controls-row">
            <div class="filters">
                <button class="filter-btn active" data-filter="All">All Assets</button>
                <button class="filter-btn" data-filter="FNO">F&O Stocks</button>
                <button class="filter-btn" data-filter="Indices">Indices</button>
                <button class="filter-btn" data-filter="Commodities">Commodities</button>
            </div>
            <button class="copy-btn" id="copy-btn" onclick="copyTickers()">
                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy Tickers
            </button>
        </div>

        <div class="table-container" id="table-container">
            <div class="loading-spinner">Fetching data...</div>
        </div>
    </main>

    <footer>CPR Screener &bull; Updated daily via GitHub Actions at 6:30 PM IST</footer>

    <script>
        let allData = [];
        let currentDisplayedTickers = [];
        let currentFilter = 'All';

        async function fetchData() {
            try {
                const response = await fetch('cpr_data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Not found");
                const data = await response.json();
                allData = data.results;
                document.getElementById('update-time').innerHTML =
                    `Last Updated: ${data.generated_at} <span>(Scanned ${data.total_scanned} symbols)</span>`;
                renderTable(currentFilter);
            } catch (e) {
                document.getElementById('table-container').innerHTML =
                    `<div class="empty-state">No data yet. Wait for GitHub Action to run at 6:30 PM IST.</div>`;
                document.getElementById('update-time').innerText = "Data not available";
            }
        }

        function renderTable(filter) {
            currentFilter = filter;
            const container = document.getElementById('table-container');
            container.innerHTML = '';

            const filteredData = filter === 'All'
                ? allData
                : allData.filter(item => item.category === filter);

            currentDisplayedTickers = filteredData.map(item => item.symbol);

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="empty-state">No ${filter === 'All' ? '' : filter} setups found today.</div>`;
                return;
            }

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            thead.innerHTML = `<tr>
                <th>#</th>
                <th>Symbol</th>
                <th>Category</th>
                <th>CMP (Close)</th>
                <th>EOD Date</th>
                <th>CPR Setups</th>
            </tr>`;
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            filteredData.forEach((item, idx) => {
                const tr = document.createElement('tr');
                let badges = '';
                if (item.is_narrow) badges += `<span class="badge badge-narrow">Narrow</span>`;
                if (item.is_inside) badges += `<span class="badge badge-inside">Inside</span>`;
                tr.innerHTML = `
                    <td class="sl-no">${idx + 1}</td>
                    <td><span class="symbol-name">${item.symbol}</span></td>
                    <td><span class="category-tag">${item.category}</span></td>
                    <td><span class="price-value">&#8377;${item.close.toLocaleString()}</span></td>
                    <td><span class="date-value">${item.eod_date || '-'}</span></td>
                    <td><div class="badges">${badges}</div></td>
                `;
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            container.appendChild(table);
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', e => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderTable(e.target.getAttribute('data-filter'));
            });
        });

        function copyTickers() {
            if (!currentDisplayedTickers.length) return;
            navigator.clipboard.writeText(currentDisplayedTickers.join(', ')).then(() => {
                const btn = document.getElementById('copy-btn');
                const orig = btn.innerHTML;
                btn.innerHTML = '&#10003; Copied!';
                setTimeout(() => { btn.innerHTML = orig; }, 2000);
            }).catch(() => alert("Copy failed."));
        }

        fetchData();
    </script>
</body>
</html>
