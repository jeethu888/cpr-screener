<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPR Screener Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a; /* Dark theme to match TradingView Pro */
            color: #f8fafc;
            font-size: 11px;
            min-height: 100vh;
        }

        header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meta-info {
            color: #94a3b8;
            font-size: 11px;
        }

        .meta-info span {
            color: #38bdf8;
            font-weight: 600;
        }

        .data-banner {
            background: #0f172a;
            border-bottom: 1px solid #334155;
            padding: 6px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-size: 11px;
            color: #94a3b8;
        }

        .data-banner .label { font-weight: 600; color: #cbd5e1; }
        .data-banner .value { color: #38bdf8; font-weight: 700; }
        .data-banner .dot { color: #475569; }

        main {
            max-width: 1200px;
            margin: 16px auto;
            padding: 0 16px;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .tabs { display: flex; gap: 8px; background: #1e293b; padding: 4px; border-radius: 8px; }
        .tab-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
        }

        .filters { display: flex; gap: 5px; flex-wrap: wrap; }
        .filter-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .filter-btn:hover { background: #334155; }
        .filter-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

        .action-btns { display: flex; gap: 8px; }
        
        .btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn:hover { background: #334155; }
        .btn-refresh { border-color: #f59e0b; color: #f59e0b; }
        .btn-refresh:hover { background: #451a03; }
        .btn-refresh .spin { display: inline-block; animation: spin 0.8s linear infinite; }

        /* Classic View */
        .table-container {
            background: #1e293b;
            border-radius: 10px;
            border: 1px solid #334155;
            overflow: hidden;
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
        th {
            background: #0f172a;
            padding: 10px 16px;
            font-weight: 700;
            color: #94a3b8;
            font-size: 11px;
            border-bottom: 1px solid #334155;
        }
        td {
            padding: 10px 16px;
            border-bottom: 1px solid #1e293b;
            font-size: 12px;
            color: #cbd5e1;
            vertical-align: middle;
        }
        tr:hover td { background: #334155; }

        /* Pro View */
        .pro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 16px;
        }
        
        .pro-panel {
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
            overflow: hidden;
        }
        .pro-panel-header {
            padding: 8px 12px;
            font-weight: 700;
            font-size: 12px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hdr-bull { background: #064e3b; color: #34d399; }
        .hdr-bear { background: #7f1d1d; color: #f87171; }
        .hdr-rev { background: #78350f; color: #fbbf24; }
        
        .pro-table th { padding: 6px 8px; font-size: 10px; }
        .pro-table td { padding: 6px 8px; font-size: 11px; border-bottom: 1px solid #334155; }
        
        /* Cell Colors based on PineScript */
        .bg-green { background: rgba(34, 197, 94, 0.2) !important; color: #4ade80 !important; }
        .bg-red { background: rgba(239, 68, 68, 0.2) !important; color: #f87171 !important; }
        .bg-yellow { background: rgba(234, 179, 8, 0.2) !important; color: #fde047 !important; }
        .bg-orange { background: rgba(249, 115, 22, 0.2) !important; color: #fdba74 !important; }
        .bg-dark { background: #1e293b !important; color: #94a3b8 !important; }
        
        .txt-green { color: #4ade80 !important; }
        .txt-red { color: #f87171 !important; }

        .symbol-cell { font-weight: 700; }
        
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script src="cpr_logic.js?v=6.2.1"></script>
</head>
<body>
    <header>
        <h1>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
            CPR Scanner Pro V6.2
        </h1>
        <div class="meta-info" id="update-time">Loading...</div>
    </header>
    <div class="data-banner" id="data-banner" style="display:none">
        <span><span class="label">NSE Data:</span> <span class="value" id="banner-date"></span></span>
        <span class="dot">|</span>
        <span><span class="label">Imported:</span> <span class="value" id="banner-time"></span></span>
        <span class="dot">|</span>
        <span><span class="label">Symbols Scanned:</span> <span class="value" id="banner-count"></span></span>
    </div>

    <main>
        <div class="controls-row">
            <div class="tabs">
                <button class="tab-btn active" id="tab-pro" onclick="switchTab('pro')">Pro Scanner</button>
                <button class="tab-btn" id="tab-classic" onclick="switchTab('classic')">Classic View</button>
            </div>
            
            <div style="display:flex; gap: 8px; align-items:center;">
                <select id="date-select" class="filter-btn" onchange="onDateChange()" style="background:#1e293b; color:#cbd5e1; border: 1px solid #334155; border-radius: 6px; padding: 4px 8px; display:none;"></select>
                
                <div id="fyers-auth-container" style="display:flex; gap: 4px;">
                    <input type="password" id="fyers-token" placeholder="Fyers AppId:Token" style="background:#1e293b; color:#cbd5e1; border: 1px solid #334155; border-radius: 6px; padding: 4px 8px; width: 160px; font-size:11px;">
                    <button class="btn" onclick="saveToken()">Save</button>
                </div>
                
                <button class="btn" id="settings-btn" onclick="toggleSettings()" style="background:#334155; padding: 6px; display:none;" title="Pro Settings">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>

            <div class="filters" id="classic-filters" style="display:none;">
                <button class="filter-btn" data-filter="All">All Assets</button>
                <button class="filter-btn active" data-filter="FNO">F&O Stocks</button>
                <button class="filter-btn" data-filter="Indices">Indices</button>
            </div>

            <div class="action-btns">
                <button class="btn btn-refresh" id="refresh-btn" onclick="refreshData()">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    Refresh Live
                </button>
            </div>
        </div>

        <!-- Classic View -->
        <div class="table-container" id="classic-container" style="display:none;"></div>

        <!-- Pro Settings Panel -->
        <div id="pro-settings" style="display:none; background:#1e293b; border:1px solid #334155; border-radius:8px; padding:16px; margin-bottom:16px; font-size:12px; color:#cbd5e1;">
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px;">
                <label><input type="checkbox" id="set-icpr"> Show Only ICPR Symbols</label>
                <label><input type="checkbox" id="set-approach" checked> Show Approaching Symbols (Near Level)</label>
                <label><input type="checkbox" id="set-all"> Show All Tickers (ignore BULL/BEAR filter)</label>
                <label><input type="checkbox" id="set-ranked" checked> Show Only Ranked Tickers (has Score &gt; 0)</label>
            </div>
            <div style="display:flex; gap:12px; margin-top:12px; align-items:center;">
                <button class="btn" onclick="applySettings()" style="background:#3b82f6;">Apply Settings</button>
            </div>
        </div>

        <!-- Pro View Grid -->
        <div class="pro-grid" id="pro-container">
            <div class="pro-panel">
                <div class="pro-panel-header hdr-bull">
                    <span>🟢 BULL WATCHLIST</span>
                    <span id="bull-count">0</span>
                </div>
                <div class="table-container" style="border:none; border-radius:0;">
                    <table class="pro-table" id="bull-table"></table>
                </div>
            </div>

            <div class="pro-panel">
                <div class="pro-panel-header hdr-bear">
                    <span>🔴 BEAR WATCHLIST</span>
                    <span id="bear-count">0</span>
                </div>
                <div class="table-container" style="border:none; border-radius:0;">
                    <table class="pro-table" id="bear-table"></table>
                </div>
            </div>

            <div class="pro-panel">
                <div class="pro-panel-header hdr-rev">
                    <span>🔥 REVERSALS</span>
                    <span id="rev-count">0</span>
                </div>
                <div class="table-container" style="border:none; border-radius:0;">
                    <table class="pro-table" id="rev-table"></table>
                </div>
            </div>
        </div>
    </main>

    <script>
        let allData = [];
        let currentTab = 'pro';
        let currentFilter = 'FNO';
        let fyersToken = localStorage.getItem('fyers_token') || "";
        
        // Settings State
        let st_onlyICPR = false;
        let st_showApproach = true;
        let st_showAll = false;
        let st_onlyRanked = false;
        
        if(fyersToken) document.getElementById('fyers-token').value = fyersToken;

        function saveToken() {
            fyersToken = document.getElementById('fyers-token').value.trim();
            localStorage.setItem('fyers_token', fyersToken);
            alert("Fyers token saved locally!");
            if(currentTab === 'pro') startProPolling();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-pro').classList.toggle('active', tab === 'pro');
            document.getElementById('tab-classic').classList.toggle('active', tab === 'classic');
            document.getElementById('pro-container').style.display = tab === 'pro' ? 'grid' : 'none';
            document.getElementById('classic-container').style.display = tab === 'classic' ? 'block' : 'none';
            document.getElementById('classic-filters').style.display = tab === 'classic' ? 'flex' : 'none';
            document.getElementById('settings-btn').style.display = tab === 'pro' ? 'block' : 'none';
            document.getElementById('fyers-auth-container').style.display = 'flex';
            if (tab !== 'pro') document.getElementById('pro-settings').style.display = 'none';
            render();
        }

        function toggleSettings() {
            const el = document.getElementById('pro-settings');
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }

        function applySettings() {
            st_onlyICPR = document.getElementById('set-icpr').checked;
            st_showApproach = document.getElementById('set-approach').checked;
            st_showAll = document.getElementById('set-all').checked;
            st_onlyRanked = document.getElementById('set-ranked').checked;
            render();
        }

        async function initApp() {
            try {
                const res = await fetch('available_dates.json?t=' + new Date().getTime());
                if (res.ok) {
                    const dates = await res.json();
                    if (dates && dates.length > 0) {
                        const select = document.getElementById('date-select');
                        
                        select.innerHTML = dates.map((d, index) => {
                            let label = d;
                            if (index === 0) label = "Today (" + d + ")";
                            else if (index === 1) label = "Yesterday (" + d + ")";
                            return `<option value="${d}">${label}</option>`;
                        }).join('');
                        
                        select.style.display = 'block';
                        await fetchData(dates[0]);
                        return;
                    }
                }
            } catch (e) {}
            // Fallback
            await fetchData(null);
        }

        async function onDateChange() {
            const date = document.getElementById('date-select').value;
            await fetchData(date);
        }

        async function fetchData(dateStr = null) {
            try {
                const url = dateStr ? `cpr_data_${dateStr}.json?t=${new Date().getTime()}` : `cpr_data.json?t=${new Date().getTime()}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("Not found");
                const data = await response.json();
                allData = data.results || [];
                
                document.getElementById('data-banner').style.display = 'flex';
                document.getElementById('banner-date').innerText = allData.length > 0 ? allData[0].eod_date : 'N/A';
                document.getElementById('banner-time').innerText = data.generated_at;
                document.getElementById('banner-count').innerText = data.total_scanned;
                document.getElementById('update-time').innerHTML = `Live Updated: <span>${data.generated_at}</span>`;
                
                render();

            } catch (e) {
                document.getElementById('pro-container').innerHTML = `<div style="padding:2rem;text-align:center;color:#94a3b8;">No data available. Trigger a refresh.</div>`;
            }
        }

        let refreshInterval = null;
        let proRefreshInterval = null;

        function startAutoRefresh() {
            if (refreshInterval) return;
            refreshInterval = setInterval(() => {
                const date = document.getElementById('date-select').value;
                fetchData(date);
            }, 5000);
        }

        function stopAutoRefresh() {
            if (!refreshInterval) return;
            clearInterval(refreshInterval);
            refreshInterval = null;
        }

        async function pollFyersLiveQuotes() {
            if (!fyersToken || currentTab !== 'pro') return;
            
            // Fetch for all symbols to properly calculate Approach and Reversals
            const lockedRows = allData;
            if (lockedRows.length === 0) return;
            
            const symbolsList = lockedRows.map(r => r.fyers_symbol || "NSE:"+r.symbol+"-EQ");
            const chunks = [];
            for (let i = 0; i < symbolsList.length; i += 50) {
                chunks.push(symbolsList.slice(i, i + 50));
            }
            
            let didUpdate = false;
            try {
                const fetchPromises = chunks.map(chunk => 
                    fetch(`https://api-t1.fyers.in/data/quotes?symbols=${chunk.join(',')}`, {
                        headers: { "Authorization": fyersToken }
                    }).then(res => res.ok ? res.json() : null)
                );
                
                const results = await Promise.all(fetchPromises);
                
                for (let json of results) {
                    if (json && json.s === "ok" && json.d) {
                        json.d.forEach(item => {
                            const sym = item.n;
                            const v = item.v;
                            const row = lockedRows.find(r => (r.fyers_symbol || "NSE:"+r.symbol+"-EQ") === sym);
                            if (row && typeof updateSymbolLogic === 'function') {
                                const now = new Date();
                                const start = new Date(); start.setHours(9, 15, 0, 0);
                                let mins = (now - start) / 60000;
                                const pct = Math.max(0.01, Math.min(mins / 375.0, 1.0));
                                
                                updateSymbolLogic(row, v.lp, v.high_price, v.low_price, v.open_price, v.v, 0, pct);
                                didUpdate = true;
                            }
                        });
                    }
                }
                if (didUpdate) render();
            } catch (e) {
                console.error("Fyers polling error", e);
            }
        }

        function startProPolling() {
            if (proRefreshInterval) return;
            proRefreshInterval = setInterval(pollFyersLiveQuotes, 1500); // 1.5s refresh
        }

        function stopProPolling() {
            if (!proRefreshInterval) return;
            clearInterval(proRefreshInterval);
            proRefreshInterval = null;
        }

        function onTabChange(tab) {
            switchTab(tab);
            if (tab === 'classic') {
                stopProPolling();
                startAutoRefresh();
            } else {
                stopAutoRefresh();
                startProPolling();
            }
        }

        document.getElementById('tab-pro').onclick = () => onTabChange('pro');
        document.getElementById('tab-classic').onclick = () => onTabChange('classic');

        function getZoneClass(z) {
            if (!z) return 'bg-dark';
            if (z.includes('▲R')) return 'bg-green';
            if (z === '▲Pvt') return 'bg-green';
            if (z === 'InCPR') return 'bg-yellow';
            if (z === '▼TC' || z === '▼Pvt') return 'bg-orange';
            if (z.includes('▼S')) return 'bg-red';
            return 'bg-dark';
        }

        function renderProTable(tableId, dataList, type) {
            const tbl = document.getElementById(tableId);
            document.getElementById(tableId.replace('-table', '-count')).innerText = dataList.length;
            
            if (dataList.length === 0) {
                tbl.innerHTML = `<tr><td style="text-align:center; color:#64748b; padding:2rem;">No ${type} signals</td></tr>`;
                return;
            }

            let html = `<thead><tr>
                <th>#</th>
                <th>Symbol</th>
                <th>Daily</th>
                <th>Weekly</th>
                <th>ICPR</th>
                <th>Setup</th>
                <th>NLvl%</th>
                <th>Vol x</th>
            </tr></thead><tbody>`;

            // Sort by Setup Signal, then NLvl%
            dataList.sort((a, b) => {
                let aSig = a.setup && a.setup.startsWith("1") ? 1 : 0;
                let bSig = b.setup && b.setup.startsWith("1") ? 1 : 0;
                if (aSig !== bSig) return bSig - aSig;
                let aN = a.nl_pct || 0;
                let bN = b.nl_pct || 0;
                return bN - aN;
            });

            dataList.forEach((r, idx) => {
                let symPrefix = "";
                let symColor = "";
                if (r.revStr === "BearRev") { symPrefix = "▼ "; symColor = "txt-red"; }
                else if (r.revStr === "BullRev") { symPrefix = "▲ "; symColor = "txt-green"; }
                else if (r.apB) { symPrefix = "↑ "; symColor = "txt-green"; }
                else if (r.apBr) { symPrefix = "↓ "; symColor = "txt-red"; }

                let setupTxt = "-";
                let setupCls = "bg-dark";
                if (r.setup) {
                    let parts = r.setup.split("|");
                    if (parts[0] === "1" || parts[0] === "-1") {
                        setupTxt = "✔ " + (parseFloat(parts[1])*100).toFixed(2) + "%";
                        setupCls = parts[0] === "1" ? "bg-green" : "bg-red";
                    }
                }

                html += `<tr>
                    <td style="color:#64748b">${r.rank && r.rank > 0 ? r.rank : '-'}</td>
                    <td class="symbol-cell ${symColor}">${symPrefix}${r.symbol}</td>
                    <td class="${getZoneClass(r.dZone)}">${r.dZone || '-'}</td>
                    <td class="${getZoneClass(r.wZone)}">${r.wZone || '-'}</td>
                    <td class="${r.icpr ? 'bg-yellow' : 'bg-dark'}" style="text-align:center">${r.icpr ? '✓' : '-'}</td>
                    <td class="${setupCls}">${setupTxt}</td>
                    <td class="${r.dZone && r.dZone.includes('▲') ? 'bg-green' : r.dZone && r.dZone.includes('▼') ? 'bg-red' : 'bg-yellow'}">${r.nl_pct ? r.nl_pct + '%' : '-'}</td>
                    <td class="${r.vRatio >= 2 ? 'bg-green' : r.vRatio >= 1 ? 'bg-yellow' : 'bg-red'}">${r.vRatio ? r.vRatio + 'x' : '-'}</td>
                </tr>`;
            });
            html += `</tbody>`;
            tbl.innerHTML = html;
        }

        function render() {
            if (currentTab === 'pro') {
                if (typeof assignRanks === 'function') assignRanks(allData);
                
                const filterRow = (r, isBullView) => {
                    if (st_onlyICPR && !r.narrow_cpr && !r.inside_cpr) return false;
                    if (st_onlyRanked && (!r.rank || r.rank <= 0)) return false;
                    
                    const isAp = st_showApproach ? (isBullView ? r.apB : r.apBr) : false;
                    const matchesBias = isBullView ? (r.bias === 'BULL' || r.bias === 'Both') : (r.bias === 'BEAR' || r.bias === 'Both');
                    
                    if (st_showAll) return true; // Show all (that passed ICPR/Rank filters)
                    return matchesBias || isAp;
                };

                const bulls = allData.filter(r => filterRow(r, true));
                const bears = allData.filter(r => filterRow(r, false));
                
                const revs = allData.filter(r => {
                    if (st_onlyICPR && !r.narrow_cpr && !r.inside_cpr) return false;
                    if (st_onlyRanked && (!r.rank || r.rank <= 0)) return false;
                    return r.revStr;
                });
                
                renderProTable('bull-table', bulls, 'Bull');
                renderProTable('bear-table', bears, 'Bear');
                renderProTable('rev-table', revs, 'Reversals');
            } else {
                const container = document.getElementById('classic-container');
                const fData = currentFilter === 'All' ? allData : allData.filter(i => i.category === currentFilter);
                
                if (!fData.length) {
                    container.innerHTML = `<div style="padding:2rem;text-align:center;color:#94a3b8;">No data for ${currentFilter}</div>`;
                    return;
                }

                // Sort: Narrow first, then Inside, then by symbol
                fData.sort((a, b) => {
                    const aPrio = a.narrow_cpr ? 2 : (a.inside_cpr ? 1 : 0);
                    const bPrio = b.narrow_cpr ? 2 : (b.inside_cpr ? 1 : 0);
                    if (aPrio !== bPrio) return bPrio - aPrio;
                    return a.symbol.localeCompare(b.symbol);
                });

                let html = `<table><thead><tr>
                    <th>#</th><th>Symbol</th><th>Live</th><th>Close</th><th>Bias</th><th>Daily Zone</th><th>Weekly Zone</th><th>Setup</th><th>Narrow CPR</th><th>Inside CPR</th>
                </tr></thead><tbody>`;
                
                fData.forEach((r, idx) => {
                    const livePrice = r.live_price != null ? r.live_price.toFixed(2) : '-';
                    html += `<tr>
                        <td style="color:#64748b;">${idx + 1}</td>
                        <td style="color:#38bdf8; font-weight:700;">${r.symbol}</td>
                        <td style="font-weight:700;">${livePrice}</td>
                        <td>${r.close}</td>
                        <td class="${r.bias === 'BULL' ? 'txt-green' : r.bias === 'BEAR' ? 'txt-red' : ''}">${r.bias}</td>
                        <td class="${getZoneClass(r.dZone)}">${r.dZone || '-'}</td>
                        <td class="${getZoneClass(r.wZone)}">${r.wZone || '-'}</td>
                        <td>${r.setup && r.setup.startsWith('1') ? 'Bull Setup' : r.setup && r.setup.startsWith('-1') ? 'Bear Setup' : '-'}</td>
                        <td class="${r.narrow_cpr ? 'bg-green' : 'bg-dark'}" style="text-align:center">${r.narrow_cpr ? '⭐' : '-'}</td>
                        <td class="${r.inside_cpr ? 'bg-yellow' : 'bg-dark'}" style="text-align:center">${r.inside_cpr ? '✅' : '-'}</td>
                    </tr>`;
                });
                html += `</tbody></table>`;
                container.innerHTML = html;
            }
        }

        document.querySelectorAll('#classic-filters .filter-btn').forEach(btn => {
            btn.addEventListener('click', e => {
                document.querySelectorAll('#classic-filters .filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-filter');
                render();
            });
        });

        async function refreshData() {
            let token = localStorage.getItem('github_pat');
            if (!token) {
                token = prompt("Enter GitHub PAT to trigger live refresh:");
                if (!token) return;
                localStorage.setItem('github_pat', token);
            }
            const btn = document.getElementById('refresh-btn');
            const orig = btn.innerHTML;
            btn.innerHTML = '<span class="spin">&#8635;</span> Running...';
            btn.disabled = true;

            try {
                const response = await fetch('https://api.github.com/repos/jeethu888/cpr-screener/actions/workflows/update_cpr.yml/dispatches', {
                    method: 'POST',
                    headers: { 'Accept': 'application/vnd.github+json', 'Authorization': `Bearer ${token}`, 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ref: 'main' })
                });
                if (response.status === 204) alert("Live scan triggered successfully! Give it 30-60 seconds, then manually refresh the page.");
                else if (response.status === 401 || response.status === 404) { localStorage.removeItem('github_pat'); alert("Auth failed. Token invalid."); }
                else throw new Error(`Status ${response.status}`);
            } catch (error) {
                alert("Failed to trigger: " + error.message);
            } finally {
                btn.innerHTML = orig;
                btn.disabled = false;
            }
        }

        initApp();
        if (currentTab === 'pro') startProPolling();
        else startAutoRefresh();
    </script>
</body>
</html>
