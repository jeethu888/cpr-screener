<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live CPR Screener</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 26, 41, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15) 0%, transparent 25%);
            background-attachment: fixed;
        }

        header {
            padding: 2.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .meta-info {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        main {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem;
            width: 100%;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow: hidden;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            padding: 1.2rem 1.5rem;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .symbol-name {
            font-weight: 700;
            color: #fff;
            font-size: 1.1rem;
        }

        .category-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            display: inline-block;
        }

        .price-value {
            font-weight: 600;
            color: #fff;
        }
        
        .date-value {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .badges {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .badge-narrow {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-inside {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }

        .loading-spinner {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: var(--text-muted);
        }
        
        .loading-spinner::after {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            margin: 1rem auto;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Live CPR Screener</h1>
        <div class="meta-info" id="update-time">Loading data...</div>
    </header>

    <main>
        <div class="filters">
            <button class="filter-btn active" data-filter="All">All Assets</button>
            <button class="filter-btn" data-filter="FNO">F&O Stocks</button>
            <button class="filter-btn" data-filter="Indices">Indices</button>
            <button class="filter-btn" data-filter="Commodities">Commodities</button>
        </div>

        <div class="table-container" id="table-container">
            <div class="loading-spinner">Fetching latest data...</div>
        </div>
    </main>

    <footer>
        <p>Automated CPR Setup Screener • Updates daily via GitHub Actions</p>
    </footer>

    <script>
        let allData = [];

        async function fetchData() {
            try {
                const response = await fetch('cpr_data.json?t=' + new Date().getTime());
                if(!response.ok) throw new Error("Data file not found");
                
                const data = await response.json();
                allData = data.results;
                
                document.getElementById('update-time').innerText = `Last Updated: ${data.generated_at} (Scanned ${data.total_scanned} symbols)`;
                
                renderTable('All');
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('table-container').innerHTML = `
                    <div class="empty-state">
                        <h3>No Data Available Yet</h3>
                        <p style="margin-top:0.5rem">If you just deployed this, please wait for the GitHub Action to run at 5:00 PM IST.</p>
                    </div>
                `;
                document.getElementById('update-time').innerText = "Data pending generation";
            }
        }

        function renderTable(filter) {
            const container = document.getElementById('table-container');
            container.innerHTML = '';

            const filteredData = filter === 'All' 
                ? allData 
                : allData.filter(item => item.category === filter);

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No Setups Found</h3>
                        <p style="margin-top:0.5rem">There are no ${filter === 'All' ? '' : filter} assets matching Narrow or Inside CPR today.</p>
                    </div>
                `;
                return;
            }

            const table = document.createElement('table');
            
            // Create Table Header
            const thead = document.createElement('thead');
            thead.innerHTML = `
                <tr>
                    <th>Symbol</th>
                    <th>Category</th>
                    <th>CMP (Close)</th>
                    <th>EOD Date</th>
                    <th>CPR Setups</th>
                </tr>
            `;
            table.appendChild(thead);

            // Create Table Body
            const tbody = document.createElement('tbody');
            filteredData.forEach(item => {
                const tr = document.createElement('tr');
                
                let badgesHTML = '';
                if(item.is_narrow) badgesHTML += `<span class="badge badge-narrow">● Narrow</span>`;
                if(item.is_inside) badgesHTML += `<span class="badge badge-inside">● Inside</span>`;

                tr.innerHTML = `
                    <td><span class="symbol-name">${item.symbol}</span></td>
                    <td><span class="category-tag">${item.category}</span></td>
                    <td><span class="price-value">₹${item.close.toLocaleString()}</span></td>
                    <td><span class="date-value">${item.eod_date || '-'}</span></td>
                    <td><div class="badges">${badgesHTML}</div></td>
                `;
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            container.appendChild(table);
        }

        // Setup filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderTable(e.target.getAttribute('data-filter'));
            });
        });

        // Initialize
        fetchData();
    </script>
</body>
</html>
