<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPR Screener</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
            color: #111111;
            font-size: 10px;
        }

        header {
            padding: 5px 12px;
            border-bottom: 1px solid #d0d0d0;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 {
            font-size: 11px;
            font-weight: 700;
            color: #111;
        }

        .meta-info {
            color: #666;
            font-size: 9px;
        }

        main {
            padding: 5px 10px;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            flex-wrap: wrap;
            gap: 4px;
        }

        .filters {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            color: #444;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .filter-btn:hover { background: #e0e0e0; }

        .filter-btn.active {
            background: #1a56db;
            color: #fff;
            border-color: #1a56db;
        }

        .copy-btn {
            background: #f0faf5;
            border: 1px solid #34a853;
            color: #1a7a40;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: background 0.15s;
        }

        .copy-btn:hover { background: #d6f5e3; }

        .table-container {
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            overflow: hidden;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #f2f2f2;
            padding: 3px 8px;
            font-weight: 700;
            color: #555;
            font-size: 8.5px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid #ccc;
        }

        td {
            padding: 0 8px;
            line-height: 1.65;
            border-bottom: 1px solid #ebebeb;
            font-size: 9.5px;
            color: #111;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f9f9f9; }

        .symbol-name {
            font-weight: 700;
            color: #000;
            font-size: 9.5px;
        }

        .category-tag {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #777;
            background: #ebebeb;
            padding: 1px 4px;
            border-radius: 2px;
        }

        .price-value { font-weight: 600; color: #000; }

        .date-value { color: #777; font-size: 8.5px; }

        .badges { display: flex; gap: 3px; }

        .badge {
            font-size: 8px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 2px;
        }

        .badge-narrow { background: #e6f4ea; color: #1a7a40; border: 1px solid #b7dfbf; }
        .badge-inside { background: #e8f0fe; color: #1a56db; border: 1px solid #b3c6f5; }

        .empty-state { text-align: center; padding: 2rem; color: #999; font-size: 10px; }

        .loading-spinner { text-align: center; padding: 1.5rem; color: #999; font-size: 10px; }
        .loading-spinner::after {
            content: '';
            display: block;
            width: 20px;
            height: 20px;
            margin: 0.5rem auto;
            border: 2px solid #ddd;
            border-top-color: #1a56db;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            text-align: center;
            padding: 5px;
            border-top: 1px solid #e0e0e0;
            color: #aaa;
            font-size: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>CPR Screener</h1>
        <div class="meta-info" id="update-time">Loading...</div>
    </header>

    <main>
        <div class="controls-row">
            <div class="filters">
                <button class="filter-btn" data-filter="All">All</button>
                <button class="filter-btn active" data-filter="FNO">F&O Stocks</button>
                <button class="filter-btn" data-filter="Indices">Indices</button>
                <button class="filter-btn" data-filter="Commodities">Commodities</button>
            </div>
            <button class="copy-btn" id="copy-btn" onclick="copyTickers()">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy Tickers
            </button>
        </div>

        <div class="table-container" id="table-container">
            <div class="loading-spinner">Fetching data...</div>
        </div>
    </main>

    <footer>CPR Screener &bull; Updated daily via GitHub Actions</footer>

    <script>
        let allData = [];
        let currentDisplayedTickers = [];
        let currentFilter = 'FNO';

        async function fetchData() {
            try {
                const response = await fetch('cpr_data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Not found");
                const data = await response.json();
                allData = data.results;
                document.getElementById('update-time').innerText =
                    `Updated: ${data.generated_at} | Scanned: ${data.total_scanned} symbols`;
                renderTable(currentFilter);
            } catch (e) {
                document.getElementById('table-container').innerHTML =
                    `<div class="empty-state">No data yet. Wait for GitHub Action to run at 6:30 PM IST.</div>`;
                document.getElementById('update-time').innerText = "Data not available";
            }
        }

        function renderTable(filter) {
            currentFilter = filter;
            const container = document.getElementById('table-container');
            container.innerHTML = '';

            const filteredData = filter === 'All'
                ? allData
                : allData.filter(item => item.category === filter);

            currentDisplayedTickers = filteredData.map(item => item.symbol);

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="empty-state">No ${filter === 'All' ? '' : filter} setups found today.</div>`;
                return;
            }

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            thead.innerHTML = `<tr>
                <th>Symbol</th>
                <th>Close</th>
                <th>EOD Date</th>
                <th>Setup</th>
            </tr>`;
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            filteredData.forEach(item => {
                const tr = document.createElement('tr');
                let badges = '';
                if (item.is_narrow) badges += `<span class="badge badge-narrow">Narrow</span>`;
                if (item.is_inside) badges += `<span class="badge badge-inside">Inside</span>`;
                tr.innerHTML = `
                    <td><span class="symbol-name">${item.symbol}</span></td>
                    <td><span class="price-value">&#8377;${item.close.toLocaleString()}</span></td>
                    <td><span class="date-value">${item.eod_date || '-'}</span></td>
                    <td><div class="badges">${badges}</div></td>
                `;
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            container.appendChild(table);
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', e => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderTable(e.target.getAttribute('data-filter'));
            });
        });

        function copyTickers() {
            if (!currentDisplayedTickers.length) return;
            navigator.clipboard.writeText(currentDisplayedTickers.join(', ')).then(() => {
                const btn = document.getElementById('copy-btn');
                const orig = btn.innerHTML;
                btn.innerHTML = '&#10003; Copied!';
                setTimeout(() => { btn.innerHTML = orig; }, 2000);
            }).catch(() => alert("Copy failed."));
        }

        fetchData();
    </script>
</body>
</html>
