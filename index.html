<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPR Screener</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #eef1f8;
            color: #1a1a2e;
            font-size: 9px;
            min-height: 100vh;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #d8dde8;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .meta-info {
            color: #6b7a99;
            font-size: 11px;
        }

        .meta-info span {
            color: #4a7fd4;
            font-weight: 600;
        }

        .data-banner {
            background: #f0f5ff;
            border-bottom: 1px solid #c8d5ef;
            padding: 4px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-size: 11px;
            color: #4a5a7a;
        }

        .data-banner .label { font-weight: 600; color: #3a4a6b; }
        .data-banner .value { color: #4a7fd4; font-weight: 700; }
        .data-banner .dot { color: #c0c8d8; }

        main {
            max-width: 860px;
            margin: 16px auto;
            padding: 0 16px;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filters { display: flex; gap: 5px; flex-wrap: wrap; }

        .filter-btn {
            background: #fff;
            border: 1px solid #c8d0e0;
            color: #6b7a99;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-btn:hover {
            background: #e8edf8;
            color: #4a7fd4;
        }

        .filter-btn.active {
            background: #4a7fd4;
            color: #fff;
            border-color: #4a7fd4;
        }

        .copy-btn {
            background: #fff;
            border: 1px solid #34a853;
            color: #34a853;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.15s;
        }

        .copy-btn:hover { background: #f0faf5; }

        .table-container {
            background: #fff;
            border-radius: 10px;
            border: 1px solid #d0d7e8;
            overflow: hidden;
            overflow-x: auto;
            box-shadow: 0 2px 12px rgba(74, 127, 212, 0.07);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: #eef1f8;
            padding: 10px 16px;
            font-weight: 700;
            color: #3a4a6b;
            font-size: 12px;
            border-bottom: 2px solid #d0d7e8;
        }

        td {
            padding: 10px 16px;
            border-bottom: 1px solid #eef1f8;
            font-size: 12.5px;
            color: #3a4a6b;
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }

        tr:hover td { background: #f5f8ff; }

        .sl-no {
            color: #b0b8cc;
            font-size: 11px;
            text-align: center;
            width: 32px;
        }

        .symbol-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .symbol-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            opacity: 0.7;
        }

        .symbol-name {
            font-weight: 700;
            color: #4a7fd4;
            font-size: 13px;
            letter-spacing: 0.02em;
        }

        .category-tag {
            font-size: 11.5px;
            color: #3a4a6b;
        }

        .price-value {
            font-weight: 600;
            color: #1a1a2e;
            font-size: 12.5px;
        }

        .date-value {
            color: #3a4a6b;
            font-size: 12px;
        }

        .badges { display: flex; gap: 5px; }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .badge-narrow {
            background: #e6f4ea;
            color: #1e8a3c;
            border: 1px solid #b7dfbf;
        }

        .badge-inside {
            background: #e8f0fe;
            color: #4a7fd4;
            border: 1px solid #b3c6f5;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #9aa3ba;
            font-size: 12px;
        }

        .loading-spinner {
            text-align: center;
            padding: 2rem;
            color: #9aa3ba;
            font-size: 12px;
        }

        .loading-spinner::after {
            content: '';
            display: block;
            width: 22px;
            height: 22px;
            margin: 0.6rem auto;
            border: 2px solid #d0d7e8;
            border-top-color: #4a7fd4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            text-align: center;
            padding: 10px;
            color: #b0b8cc;
            font-size: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>&#9685; CPR Screener</h1>
        <div class="meta-info" id="update-time">Loading...</div>
    </header>
    <div class="data-banner" id="data-banner" style="display:none">
        <span><span class="label">NSE Data:</span> <span class="value" id="banner-date"></span></span>
        <span class="dot">|</span>
        <span><span class="label">Imported:</span> <span class="value" id="banner-time"></span></span>
        <span class="dot">|</span>
        <span><span class="label">Symbols Scanned:</span> <span class="value" id="banner-count"></span></span>
    </div>

    <main>
        <div class="controls-row">
            <div class="filters">
                <button class="filter-btn" data-filter="All">All Assets</button>
                <button class="filter-btn active" data-filter="FNO">F&O Stocks</button>
                <button class="filter-btn" data-filter="Indices">Indices</button>
                <button class="filter-btn" data-filter="Commodities">Commodities</button>
            </div>
            <button class="copy-btn" id="copy-btn" onclick="copyTickers()">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                Copy Tickers
            </button>
        </div>

        <div class="table-container" id="table-container">
            <div class="loading-spinner">Fetching data...</div>
        </div>
    </main>

    <footer>CPR Screener &bull; NSE Bhav Copy &bull; Updated daily at 6:30 PM IST</footer>

    <script>
        // CPR icon SVG (inline, like Chartink)
        const CPR_ICON = `<svg class="symbol-icon" viewBox="0 0 24 24" fill="none" stroke="#4a7fd4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
            <circle cx="12" cy="12" r="4"/>
            <line x1="7" y1="7" x2="9.5" y2="9.5"/><line x1="14.5" y1="14.5" x2="17" y2="17"/>
            <line x1="17" y1="7" x2="14.5" y2="9.5"/><line x1="9.5" y1="14.5" x2="7" y2="17"/>
        </svg>`;

        let allData = [];
        let currentDisplayedTickers = [];
        let currentFilter = 'FNO';

        async function fetchData() {
            try {
                const response = await fetch('cpr_data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Not found");
                const data = await response.json();
                allData = data.results;
                const genAt = data.generated_at || '';
                // Show banner
                document.getElementById('data-banner').style.display = 'flex';
                // EOD date is the eod_date of first result
                const eodDate = allData.length > 0 ? allData[0].eod_date : 'N/A';
                // Format eod_date as DD-MM-YYYY
                const dp = (eodDate || '').split('-');
                const fmtEod = dp.length === 3 ? `${dp[2]}-${dp[1]}-${dp[0]}` : eodDate;
                document.getElementById('banner-date').innerText = fmtEod;
                document.getElementById('banner-time').innerText = genAt;
                document.getElementById('banner-count').innerText = data.total_scanned;
                document.getElementById('update-time').innerHTML =
                    `Last Updated: <span>${genAt}</span>`;
                renderTable(currentFilter);
            } catch (e) {
                document.getElementById('table-container').innerHTML =
                    `<div class="empty-state">No data yet. Wait for GitHub Action to run at 6:30 PM IST.</div>`;
                document.getElementById('update-time').innerText = "Data not available";
            }
        }

        function renderTable(filter) {
            currentFilter = filter;
            const container = document.getElementById('table-container');
            container.innerHTML = '';

            const filteredData = filter === 'All'
                ? allData
                : allData.filter(item => item.category === filter);

            currentDisplayedTickers = filteredData.map(item => item.symbol);

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="empty-state">No ${filter === 'All' ? '' : filter} setups found today.</div>`;
                return;
            }

            const table = document.createElement('table');

            const thead = document.createElement('thead');
            thead.innerHTML = `<tr>
                <th>#</th>
                <th>Symbol</th>
                <th>Category</th>
                <th>Close</th>
                <th>Date</th>
                <th>Setup</th>
            </tr>`;
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            filteredData.forEach((item, idx) => {
                const tr = document.createElement('tr');
                let badges = '';
                if (item.is_narrow) badges += `<span class="badge badge-narrow">Narrow CPR</span>`;
                if (item.is_inside) badges += `<span class="badge badge-inside">Inside CPR</span>`;

                // Format date as DD-MM-YYYY like Chartink
                const dateParts = (item.eod_date || '').split('-');
                const formattedDate = dateParts.length === 3
                    ? `${dateParts[2]}-${dateParts[1]}-${dateParts[0]}`
                    : (item.eod_date || '-');

                tr.innerHTML = `
                    <td class="sl-no">${idx + 1}</td>
                    <td>
                        <div class="symbol-cell">
                            ${CPR_ICON}
                            <span class="symbol-name">${item.symbol}</span>
                        </div>
                    </td>
                    <td><span class="category-tag">${item.category}</span></td>
                    <td><span class="price-value">&#8377;${item.close.toLocaleString()}</span></td>
                    <td><span class="date-value">${formattedDate}</span></td>
                    <td><div class="badges">${badges}</div></td>
                `;
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            container.appendChild(table);
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', e => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderTable(e.target.getAttribute('data-filter'));
            });
        });

        function copyTickers() {
            if (!currentDisplayedTickers.length) return;
            navigator.clipboard.writeText(currentDisplayedTickers.join(', ')).then(() => {
                const btn = document.getElementById('copy-btn');
                const orig = btn.innerHTML;
                btn.innerHTML = '&#10003; Copied!';
                setTimeout(() => { btn.innerHTML = orig; }, 2000);
            }).catch(() => alert("Copy failed."));
        }

        fetchData();
    </script>
</body>
</html>
