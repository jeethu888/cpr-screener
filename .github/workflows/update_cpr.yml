name: Update CPR Data

on:
  schedule:
    # Auto-run at 5:00 PM IST (11:30 UTC) every weekday
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      fyers_token:
        description: 'Fyers Access Token (paste your daily token here)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CPR script
        env:
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          # Use manually entered token if provided, otherwise fall back to stored secret
          FYERS_ACCESS_TOKEN: ${{ github.event.inputs.fyers_token || secrets.FYERS_ACCESS_TOKEN }}
        run: python generate_cpr.py

      - name: Commit and push updated data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git add *.json
          git diff --staged --quiet || (git commit -m "EOD CPR update $(date +'%Y-%m-%d %H:%M IST')" && git push origin main)
